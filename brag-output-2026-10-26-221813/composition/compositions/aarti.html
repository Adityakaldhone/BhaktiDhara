  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#aa-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#aa-title .w", { opacity: 0, y: 18, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out", stagger: 0.07 }, 0.12);
      tl.fromTo("#aa-body", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.6);
      tl.fromTo("#aa-phone", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.1);

      tl.fromTo("#aa-progress-bar", { scaleX: 0.08 }, { scaleX: 0.42, duration: 6.8, ease: "none" }, 0.2);
      tl.fromTo("#aa-awake", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 1.1);
      tl.to("#aa-awake", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 3.4);

      // Active lyric line steps down; the box auto-scrolls.
      const at = [0.6, 1.3, 2.0, 2.7, 3.4, 4.1];
      at.forEach((t, i) => {
        const sel = "#aa-l" + (i + 1);
        tl.to(sel, { color: "#9a3412", backgroundColor: "#fde8c8", duration: 0.22, ease: "power2.out" }, t);
        if (i < at.length - 1) tl.to(sel, { color: "#a8a29e", backgroundColor: "rgba(253,232,200,0)", duration: 0.22, ease: "power2.out" }, at[i + 1]);
      });
      tl.to("#aa-lines", { y: -72, duration: 0.45, ease: "power2.inOut" }, 2.65);
      tl.to("#aa-lines", { y: -144, duration: 0.45, ease: "power2.inOut" }, 3.35);

      // Taps on Ghanti / Shankh / Pushpa (screen-space coordinates of each disc centre).
      const taps = [
        { el: "#aa-t1", x: 140, y: 1118, at: 3.93 },
        { el: "#aa-t2", x: 342, y: 1118, at: 4.93 },
        { el: "#aa-t3", x: 544, y: 1118, at: 5.93 },
      ];
      taps.forEach(({ el, x, y, at }) => {
        tl.set("#aa-touch", { x, y }, at - 0.12);
        tl.fromTo("#aa-touch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, at - 0.1);
        tl.to(el, { scale: 0.92, duration: 0.1, ease: "power2.out" }, at);
        tl.to(el, { scale: 1, duration: 0.35, ease: "expo.out" }, at + 0.1);
        tl.to("#aa-touch", { opacity: 0, duration: 0.22, ease: "power2.out" }, at + 0.16);
      });
      [16, -11, 7, -4, 0].forEach((deg, i) => {
        tl.to("#aa-bell-ico", { rotation: deg, transformOrigin: "50% 10%", duration: 0.16, ease: "sine.inOut" }, 3.98 + i * 0.16);
      });

      // Petal shower, deterministic.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const host = document.querySelector("#aa-petals");
      const colors = ["#f97316", "#fb923c", "#facc15", "#ef4444", "#fdba74"];
      for (let i = 0; i < 22; i++) {
        const p = document.createElement("div");
        p.className = "aa-petal";
        p.style.left = "0px";
        p.style.background = colors[i % colors.length];
        host.appendChild(p);
        const x = 20 + rnd() * 640;
        const start = 6.0 + rnd() * 0.5;
        tl.fromTo(
          p,
          { x, y: 0, rotation: rnd() * 180 },
          { x: x + (rnd() - 0.5) * 160, y: 1360, rotation: 360 + rnd() * 360, duration: 1.0 + rnd() * 0.4, ease: "power1.in" },
          start,
        );
      }

      tl.to("#aa-stage", { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 6.87);

      window.__timelines["aarti"] = tl;
    })();
  </script>
