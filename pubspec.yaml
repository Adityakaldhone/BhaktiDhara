name: nitya_aarti
description: "BhaktiDhara: Aarti Sangrah"
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Smooth auto-scrolling synced lyrics list
  scrollable_positioned_list: ^0.3.8

  # Keep screen awake during pooja (WakelockPlus.enable/disable)
  wakelock_plus: ^1.2.0

  # Monetisation — AdMob banners strictly on Dashboard only
  # v9+ required for Gradle 8 compatibility (v5.x used removed configurations.all API)
  google_mobile_ads: ^9.1.0

  # Bell (ghanti) and conch (shankh) sound effects
  audioplayers: ^6.1.0

  # State Management (Clean Architecture)
  flutter_riverpod: ^2.4.9

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Strict In-App Embedded Video Player
  webview_flutter: ^4.10.0
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^8.2.1
  change_app_package_name: ^1.5.0
  speech_to_text: ^7.5.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.4
  webview_flutter_web: ^0.2.3+4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  characters: ^1.4.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/devotional_catalog.json
    - assets/app_logo/logo.png
    - assets/decorations/
    - assets/aarti_screen/
    - assets/aarti_list/
    - assets/sounds/
    # One repetition per mantra for chant-along (currently TTS placeholders)
    - assets/sounds/jaap/
    # Bundled so status cards render offline with identical typography
    - assets/google_fonts/
    - shorebird.yaml
    # Add ghanti.mp3 and shankh.mp3 under assets/sounds/ before production build
    # - assets/sounds/ghanti.mp3
    # - assets/sounds/shankh.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Regenerate native launch screens after changes: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FCF6E8"
  image: assets/app_logo/logo.png
  color_dark: "#FCF6E8"
  image_dark: assets/app_logo/logo.png
  android_12:
    color: "#FCF6E8"
    image: assets/app_logo/logo.png
    color_dark: "#FCF6E8"
    image_dark: assets/app_logo/logo.png
  web: false
