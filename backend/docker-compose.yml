version: '3.8'

services:
  bhaktidhara-api:
    build: .
    container_name: bhaktidhara_backend
    restart: always
    ports:
      - "8080:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_RPM=${GEMINI_RPM:-10}
      - PRECACHE_RPM=${PRECACHE_RPM:-5}
      - ADMIN_SECRET=${ADMIN_SECRET:-mandir_secret_2026}
      - DB_PATH=/app/data/bhaktidhara.db
      - FIREBASE_SERVICE_ACCOUNT=/app/data/firebase-service-account.json
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - IMAGE_AI_PROVIDER=${IMAGE_AI_PROVIDER:-openai}
      - USE_R2_STORAGE=${USE_R2_STORAGE:-false}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-bhaktidharabucket}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-${R2_ACCOUNT_ID}}
      - GA4_API_SECRET=${GA4_API_SECRET:-}
      - GA4_FIREBASE_APP_ID=${GA4_FIREBASE_APP_ID:-1:72583369850:android:d6506f510ce6a02dd9d7c3}
      - GA4_MP_DEBUG=${GA4_MP_DEBUG:-}
      - RTDN_PUSH_TOKEN=${RTDN_PUSH_TOKEN:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
