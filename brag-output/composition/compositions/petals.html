  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Seeded PRNG (mulberry32) so every render scatters the marigold petals identically.
      let seed = 108;
      const rand = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const colors = ["#F59E0B", "#EA580C", "#FBBF24", "#D97706", "#F97316"];

      for (let i = 0; i < 32; i++) {
        const sel = "#petal-" + i;
        const x = 40 + rand() * 1840;
        const start = rand() * 0.75;
        const fall = 1.55 + rand() * 0.55;
        const drift = (rand() - 0.5) * 220;
        const spin = (rand() - 0.5) * 720;
        const size = 0.7 + rand() * 0.7;
        tl.set(sel, { backgroundColor: colors[i % colors.length], scale: size }, 0);
        tl.fromTo(
          sel,
          { y: 0, x: x, rotation: rand() * 360 },
          { y: 1280, x: x + drift, rotation: "+=" + spin, duration: fall, ease: "none" },
          start,
        );
      }

      window.__timelines["petals"] = tl;
    })();
